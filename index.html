<!DOCTYPE html>
<html lang="es" data-theme="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4e8f2">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Trips">
  <meta name="description" content="Compara coche, transporte público y park and ride en la Comunidad de Madrid.">
  <title>Trips · Coche, transporte o las dos cosas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var t = localStorage.getItem("trips.v1.theme");
      if (t === "claro" || t === "grafito" || t === "medianoche" || t === "grafito-oscuro") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="mesh"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grain"></div>
  </div>

  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M4 14.5h16l-1.2-4.2A2 2 0 0 0 16.9 9H7.1a2 2 0 0 0-1.9 1.3L4 14.5z"/><path d="M5 14.5V17a1 1 0 0 0 1 1h1.2a1.3 1.3 0 0 0 2.6 0h5.4a1.3 1.3 0 0 0 2.6 0H19a1 1 0 0 0 1-1v-2.5"/><path d="M7.2 9l.6-2.2A1.5 1.5 0 0 1 9.3 5.5h5.4a1.5 1.5 0 0 1 1.5 1.3l.6 2.2"/></symbol>
      <symbol id="i-train" viewBox="0 0 24 24"><rect x="6" y="3.5" width="12" height="13.5" rx="3.2"/><path d="M6 10.5h12"/><circle cx="9.3" cy="13.7" r=".6" fill="currentColor"/><circle cx="14.7" cy="13.7" r=".6" fill="currentColor"/><path d="M8.5 17l-2 3.5M15.5 17l2 3.5"/></symbol>
      <symbol id="i-mix" viewBox="0 0 24 24"><circle cx="6.5" cy="6.5" r="2.2"/><circle cx="17.5" cy="17.5" r="2.2"/><path d="M8.4 7.8C12 8 14 10.5 14 13.5V15c0 1.2.8 2.5 3.3 2.5"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M8 4v15M4.5 7.5 8 4l3.5 3.5"/><path d="M16 20V5M12.5 16.5 16 20l3.5-3.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4.5 11V9.5A3 3 0 0 1 7.5 6.5h12"/><path d="m16.5 3.5 3 3-3 3"/><path d="M19.5 13v1.5a3 3 0 0 1-3 3h-12"/><path d="m7.5 20.5-3-3 3-3"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.8 2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.6l-5 2.6.9-5.6-4-3.9 5.6-.8z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11.2A7 7 0 0 0 5 9.8C5 15.4 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.2"/></symbol>
      <symbol id="i-pump" viewBox="0 0 24 24"><path d="M5 20.5V5.5a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v15"/><path d="M3.5 20.5h12"/><path d="M7 7.5h5"/><path d="M14 10h1.6a1.4 1.4 0 0 1 1.4 1.4v4.4a1.6 1.6 0 0 0 3.2 0V8.5l-2.7-2.7"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.2"/><circle cx="12" cy="7.9" r=".6" fill="currentColor"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 14.5V3.8M8.3 7.3 12 3.6l3.7 3.7"/><path d="M8 10.5H6.5a1.5 1.5 0 0 0-1.5 1.5v7a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></symbol>
      <symbol id="i-p" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M10 16.5v-9h2.8a2.7 2.7 0 0 1 0 5.4H10"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></symbol>
      <symbol id="i-walk" viewBox="0 0 24 24"><circle cx="13" cy="4.6" r="1.7"/><path d="M10.6 21l1.8-5.2-2.4-2.4.8-4.6"/><path d="M8 11.5l2.4-3.1 3.1.4 2 3 2.3.9"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <main id="screen" class="screen" aria-live="polite"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Secciones">
    <button type="button" data-tab="compare" class="is-active">
      <svg class="ic" width="22" height="22"><use href="#i-mix"/></svg><span>Comparar</span>
    </button>
    <button type="button" data-tab="favs">
      <svg class="ic" width="22" height="22"><use href="#i-star"/></svg><span>Favoritos</span>
    </button>
    <button type="button" data-tab="parks">
      <svg class="ic" width="22" height="22"><use href="#i-p"/></svg><span>Aparcamientos</span>
    </button>
    <button type="button" data-tab="car">
      <svg class="ic" width="22" height="22"><use href="#i-car"/></svg><span>Coche</span>
    </button>
  </nav>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet-vehicle" role="dialog" aria-labelledby="veh-title" hidden>
    <div class="sheet-handle"></div>
    <button type="button" class="icon-btn sheet-close" id="veh-close" aria-label="Cerrar">
      <svg class="ic" width="18" height="18"><use href="#i-close"/></svg>
    </button>
    <h2 id="veh-title">Tu coche</h2>
    <p class="lead">Marca, modelo y motor de la lista de Surtidor. Se guarda en este móvil.</p>
    <label class="sr-only" for="veh-q">Buscar vehículo</label>
    <input id="veh-q" class="sheet-search" type="search" placeholder="Volvo, León, Corolla…" autocomplete="off">
    <div id="veh-list" class="picker-list"></div>
  </div>
  <div class="sheet" id="sheet-park" role="dialog" aria-labelledby="upk-title" hidden>
    <div class="sheet-handle"></div>
    <button type="button" class="icon-btn sheet-close" id="upk-close" aria-label="Cerrar">
      <svg class="ic" width="18" height="18"><use href="#i-close"/></svg>
    </button>
    <h2 id="upk-title">Mi aparcamiento habitual</h2>
    <p class="lead">Disuasorios del CRTM y estaciones de Cercanías, Metro y Metro Ligero con aparcamiento cerca. Se guarda en este móvil.</p>
    <label class="sr-only" for="upk-q">Buscar estación o aparcamiento</label>
    <input id="upk-q" class="sheet-search" type="search" placeholder="La Garena, Torrejón, Canillejas…" autocomplete="off">
    <div id="upk-list" class="picker-list"></div>
  </div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
